[package]
name = "pinglive"
version = "0.1.0"
edition = "2021"
authors = ["Dh3niel"]
license = "MIT"
description = "Transparent always-on-top ping overlay for games (Dota 2), with live graph, timeout counter and audio alerts"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
winping = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
global-hotkey = "0.6"
tray-icon = "0.19"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
windows-service = "0.8.1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_RemoteDesktop",
    "Win32_System_Environment",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.31"
